# sonar-project.properties
# Configuración del análisis de envios-service en SonarQube.
# La lee el escáner CLI (sonar-scanner). Con `mvn sonar:sonar` Maven deriva los mismos
# valores del pom (projectKey = groupId:artifactId, projectName = <name>), así que ambos
# caminos analizan el mismo proyecto.

# Identidad del proyecto en el servidor: debe coincidir con la creada en el Paso 1.
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Código de producción y de pruebas: Sonar mide reglas sobre el primero y no cuenta
# el segundo como código a cubrir.
sonar.sources=src/main/java
sonar.tests=src/test/java

# Bytecode compilado: el analizador de Java lo necesita para resolver tipos.
sonar.java.binaries=target/classes

# Reporte XML que genera JaCoCo en `mvn verify`; de aquí sale la cobertura.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor local en Docker (Decisión de diseño 1). El token NO va aquí: se pasa con -Dsonar.token.
sonar.host.url=http://localhost:9000

# No bloquear el build esperando el Quality Gate; su resultado se revisa en el dashboard.
sonar.qualitygate.wait=false

# Decisión de diseño 2: no se excluye nada. Todo el código es lógica de negocio
# (no hay clase Main ni DTOs generados); excluir algo maquillaría la cobertura.
# sonar.exclusions=
